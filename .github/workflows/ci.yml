name: BrewLite CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fixed-**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-ci:
    name: 🛡️ Backend Lint, Tests & Concurrency Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123
          POSTGRES_DB: brewlite
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:123@localhost:5432/brewlite?schema=public"
      JWT_SECRET: "brewlite_super_secret_jwt_key_2026"
      JWT_EXPIRES_IN: "1d"
      PORT: 3001
      VNP_TMN_CODE: "8VXIB1MM"
      VNP_HASH_SECRET: "GJZGJZTKHBYBESRSLCLSPZXGFPEXVPGF"
      VNP_URL: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
      VNP_RETURN_URL: "http://localhost:3001/payments/vnpay/return"
      FRONTEND_URL: "http://localhost:3000"

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install Backend Dependencies
        working-directory: backend
        run: npm ci || npm install

      - name: 🔄 Generate Prisma Client & Migrate Database
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma db push --accept-data-loss
          npx prisma db seed

      - name: 🔍 Run Oxlint Code Quality Check
        working-directory: backend
        run: npm run lint

      - name: 🏗️ Build Backend NestJS
        working-directory: backend
        run: npm run build

      - name: 🧪 Run Jest Unit Tests (65 test cases)
        working-directory: backend
        run: npm test

      - name: ⚡ Run Concurrency & Anti-Overselling Stress Test
        working-directory: backend
        run: npx ts-node scripts/test-concurrency.ts

  frontend-ci:
    name: 🎨 Frontend Lint & Next.js Build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: "http://localhost:3001"

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: 🔍 Run ESLint Check
        working-directory: frontend
        run: npm run lint

      - name: 🏗️ Build Next.js Application
        working-directory: frontend
        run: npm run build
