$kind: http-request
url: "{{baseUrl}}/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      pm.test('Body is non-empty', function () { pm.expect(pm.response.text()).to.not.be.empty; });
    language: text/javascript
order: 1000
