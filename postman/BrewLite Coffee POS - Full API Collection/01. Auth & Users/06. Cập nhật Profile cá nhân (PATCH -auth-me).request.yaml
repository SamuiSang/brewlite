$kind: http-request
url: "{{baseUrl}}/auth/me"
method: PATCH
headers:
  Authorization: "Bearer {{tokenCustomer}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "fullName": "Nguyễn Văn A",
      "phone": "0903334444"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      const res = pm.response.json();
      pm.test('Updated profile matches payload', function () {
        pm.expect(res.fullName).to.eql('Nguyễn Văn A');
        pm.expect(res.phone).to.eql('0903334444');
      });
    language: text/javascript
order: 6000
