$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "barista@brewlite.vn",
      "password": "Password123"
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res.accessToken) {
          pm.collectionVariables.set('tokenBarista', res.accessToken);
          pm.environment.set('tokenBarista', res.accessToken);
          pm.globals.set('tokenBarista', res.accessToken);
          console.log('Saved tokenBarista successfully');
      }
    language: text/javascript
order: 2000
