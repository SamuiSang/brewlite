$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "khachhang@gmail.com",
      "password": "Password123"
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res.accessToken) {
          pm.collectionVariables.set('tokenCustomer', res.accessToken);
          pm.environment.set('tokenCustomer', res.accessToken);
          pm.globals.set('tokenCustomer', res.accessToken);
          console.log('Saved tokenCustomer successfully');
      }
    language: text/javascript
order: 1000
