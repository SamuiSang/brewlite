$kind: http-request
url: "{{baseUrl}}/toppings"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      const res = pm.response.json();
      pm.test('Toppings is non-empty array', function () {
        pm.expect(res).to.be.an('array').that.is.not.empty;
        pm.expect(res[0]).to.have.property('id');
        pm.expect(res[0]).to.have.property('price');
      });
      if (res[0]?.id) {
        pm.collectionVariables.set('firstToppingId', res[0].id);
        pm.environment.set('firstToppingId', res[0].id);
      }
    language: text/javascript
order: 2000
