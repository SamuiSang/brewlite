$kind: http-request
url: "{{baseUrl}}/cart/items"
method: POST
headers:
  Authorization: "Bearer {{tokenCustomer}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "productId": "p1111111-1111-1111-1111-222222222222",
      "size": "M",
      "quantity": 1,
      "milk": "Sữa đặc",
      "note": "Ít đá",
      "toppings": [
        "t1111111-1111-1111-1111-111111111111"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 201', function () { pm.response.to.have.status(201); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      const res = pm.response.json();
      pm.test('Added item with enriched unitPrice (29k + 5k M + 10k topping = 44k)', function () {
        pm.expect(res.lastAddedItemId).to.be.a('string');
        pm.expect(res.items.length).to.eql(1);
        pm.expect(res.items[0].unitPrice).to.eql(44000);
        pm.expect(res.items[0].lineTotal).to.eql(44000);
        pm.expect(res.summary.subtotal).to.eql(44000);
      });
      pm.collectionVariables.set('currentCartItemId', res.lastAddedItemId);
      pm.environment.set('currentCartItemId', res.lastAddedItemId);
    language: text/javascript
order: 3000
