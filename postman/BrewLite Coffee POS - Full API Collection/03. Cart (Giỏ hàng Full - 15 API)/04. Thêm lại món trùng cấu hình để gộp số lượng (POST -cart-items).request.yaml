$kind: http-request
url: "{{baseUrl}}/cart/items"
method: POST
headers:
  Authorization: "Bearer {{tokenCustomer}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "productId": "p1111111-1111-1111-1111-222222222222",
      "size": "M",
      "quantity": 1,
      "milk": "Sữa đặc",
      "note": "Ít đá",
      "toppings": [
        "t1111111-1111-1111-1111-111111111111"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 201', function () { pm.response.to.have.status(201); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      const res = pm.response.json();
      pm.test('Merged into existing cart item with quantity = 2', function () {
        pm.expect(res.items.length).to.eql(1);
        pm.expect(res.items[0].quantity).to.eql(2);
        pm.expect(res.items[0].lineTotal).to.eql(88000);
        pm.expect(res.summary.totalItems).to.eql(2);
      });
    language: text/javascript
order: 4000
