$kind: http-request
url: "{{baseUrl}}/cart/items/{{currentCartItemId}}/quantity"
method: PATCH
headers:
  Authorization: "Bearer {{tokenCustomer}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "delta": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      const res = pm.response.json();
      const targetId = pm.environment.get('currentCartItemId') || pm.collectionVariables.get('currentCartItemId');
      const updated = res.items.find(i => i.id === targetId);
      pm.test('Quantity incremented from 2 to 3', function () {
        pm.expect(updated.quantity).to.eql(3);
      });
    language: text/javascript
order: 8000
