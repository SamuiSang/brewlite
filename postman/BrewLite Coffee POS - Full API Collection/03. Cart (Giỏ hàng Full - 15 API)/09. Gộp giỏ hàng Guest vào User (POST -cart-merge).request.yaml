$kind: http-request
url: "{{baseUrl}}/cart/merge"
method: POST
headers:
  Authorization: "Bearer {{tokenCustomer}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "items": [
        {
          "productId": "prod-1",
          "size": "M",
          "quantity": 1,
          "milk": "Không đường",
          "note": "Mang đi",
          "toppings": []
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 201', function () { pm.response.to.have.status(201); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      const res = pm.response.json();
      pm.test('Merged guest item without losing existing DB items', function () {
        pm.expect(res.items.length).to.eql(3);
        pm.expect(res.summary.totalItems).to.eql(5);
      });
    language: text/javascript
order: 9000
