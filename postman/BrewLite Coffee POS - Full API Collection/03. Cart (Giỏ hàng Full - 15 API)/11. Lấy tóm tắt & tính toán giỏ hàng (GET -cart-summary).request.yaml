$kind: http-request
url: "{{baseUrl}}/cart/summary"
method: GET
headers:
  Authorization: "Bearer {{tokenCustomer}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      const res = pm.response.json();
      pm.test('Summary returns subtotal, canCheckout and validation', function () {
        pm.expect(res.subtotal).to.be.above(0);
        pm.expect(res.canCheckout).to.eql(true);
        pm.expect(res.validation).to.be.an('object');
      });
    language: text/javascript
order: 11000
