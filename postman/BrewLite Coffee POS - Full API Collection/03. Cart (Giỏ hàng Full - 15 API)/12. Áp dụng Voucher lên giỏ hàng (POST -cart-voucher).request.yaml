$kind: http-request
url: "{{baseUrl}}/cart/voucher"
method: POST
headers:
  Authorization: "Bearer {{tokenCustomer}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "code": "BREW5"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 201', function () { pm.response.to.have.status(201); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      const res = pm.response.json();
      pm.test('Voucher BREW5 applied with 5000 discount', function () {
        pm.expect(res.voucherCode).to.eql('BREW5');
        pm.expect(res.summary.voucherDiscount).to.eql(5000);
        pm.expect(res.summary.finalTotal).to.eql(res.summary.subtotal - 5000);
      });
    language: text/javascript
order: 12000
