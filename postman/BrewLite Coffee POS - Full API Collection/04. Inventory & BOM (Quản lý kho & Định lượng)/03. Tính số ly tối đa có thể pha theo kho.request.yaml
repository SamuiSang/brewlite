$kind: http-request
url: "{{baseUrl}}/inventory/availability/prod-2?size=M"
method: GET
queryParams:
  size: M
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      const res = pm.response.json();
      pm.test('Returns maxCups and bottleneck info', function () {
        pm.expect(res).to.have.property('maxCups');
        pm.expect(res.maxCups).to.be.a('number');
      });
    language: text/javascript
order: 3000
