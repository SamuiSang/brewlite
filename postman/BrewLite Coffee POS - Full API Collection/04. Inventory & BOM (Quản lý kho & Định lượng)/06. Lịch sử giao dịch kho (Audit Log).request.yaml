$kind: http-request
url: "{{baseUrl}}/inventory/transactions?limit=20"
method: GET
queryParams:
  limit: "20"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      const res = pm.response.json();
      pm.test('Returns transaction history array', function () {
        pm.expect(res).to.be.an('array');
      });
    language: text/javascript
order: 6000
