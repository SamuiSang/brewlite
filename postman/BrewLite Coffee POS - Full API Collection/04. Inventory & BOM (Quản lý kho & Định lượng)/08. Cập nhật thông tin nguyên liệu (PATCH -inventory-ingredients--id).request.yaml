$kind: http-request
url: "{{baseUrl}}/inventory/ingredients/{{tempIngredientId}}"
method: PATCH
headers:
  Authorization: "Bearer {{tokenAdmin}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "minimumStock": 250,
      "costPerUnit": 180
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      const res = pm.response.json();
      pm.test('Ingredient updated minimumStock and costPerUnit', function () {
        pm.expect(Number(res.minimumStock)).to.eql(250);
        pm.expect(Number(res.costPerUnit)).to.eql(180);
      });
    language: text/javascript
order: 8000
