$kind: http-request
url: "{{baseUrl}}/inventory/recipes/prod-11/ingredient/ing-17?size=M"
method: DELETE
headers:
  Authorization: "Bearer {{tokenAdmin}}"
queryParams:
  size: M
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      const res = pm.response.json();
      pm.test('Ingredient removed from recipe', function () {
        pm.expect(res).to.be.an('object');
      });
