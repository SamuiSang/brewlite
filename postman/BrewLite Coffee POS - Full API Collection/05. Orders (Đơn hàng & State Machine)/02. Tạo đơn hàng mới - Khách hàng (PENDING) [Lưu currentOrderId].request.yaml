$kind: http-request
url: "{{baseUrl}}/orders"
method: POST
headers:
  Authorization: "Bearer {{tokenCustomer}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "customerName": "Nguyễn Văn A",
      "phone": "0903334444",
      "deliveryAddress": "123 Nguyễn Văn Cừ, Q.5, TP.HCM",
      "notes": "Đơn test State Machine",
      "items": [
        {
          "productId": "p1111111-1111-1111-1111-222222222222",
          "size": "M",
          "qty": 2,
          "toppingIds": [
            "t1111111-1111-1111-1111-111111111111"
          ]
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 201', function () { pm.response.to.have.status(201); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      const res = pm.response.json();
      pm.test('Order created in PENDING status with #code', function () {
        pm.expect(res.id).to.be.a('string');
        pm.expect(res.status).to.eql('PENDING');
        pm.expect(res.orderCode).to.match(/^#\d+/);
      });
      pm.collectionVariables.set('currentOrderId', res.id);
      pm.environment.set('currentOrderId', res.id);
      pm.collectionVariables.set('currentOrderCode', res.orderCode.replace('#', ''));
      pm.environment.set('currentOrderCode', res.orderCode.replace('#', ''));
    language: text/javascript
order: 2000
