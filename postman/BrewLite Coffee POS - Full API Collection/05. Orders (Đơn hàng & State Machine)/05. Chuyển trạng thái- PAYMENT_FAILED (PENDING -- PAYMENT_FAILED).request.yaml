$kind: http-request
url: "{{baseUrl}}/orders/{{currentOrderId}}/status"
method: PATCH
headers:
  Authorization: "Bearer {{tokenBarista}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "status": "PAYMENT_FAILED",
      "reason": "Thẻ lỗi thử nghiệm"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      const res = pm.response.json();
      pm.test('Order moved to PAYMENT_FAILED', function () {
        pm.expect(res.status).to.eql('PAYMENT_FAILED');
      });
    language: text/javascript
order: 5000
