$kind: http-request
url: "{{baseUrl}}/orders/{{cancelOrderId}}/cancel"
method: POST
headers:
  Authorization: "Bearer {{tokenCustomer}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "reason": "Khách đổi ý (POST)"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 201', function () { pm.response.to.have.status(201); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      const res = pm.response.json();
      pm.test('Order cancelled via POST', function () {
        pm.expect(res.status).to.eql('CANCELLED');
      });
    language: text/javascript
order: 11000
