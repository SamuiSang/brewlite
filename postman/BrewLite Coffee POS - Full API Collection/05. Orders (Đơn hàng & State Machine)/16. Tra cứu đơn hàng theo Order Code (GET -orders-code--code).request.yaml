$kind: http-request
url: "{{baseUrl}}/orders/code/{{currentOrderCode}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      const res = pm.response.json();
      pm.test('Order found by orderCode', function () {
        pm.expect(res.id).to.eql(pm.environment.get('currentOrderId') || pm.collectionVariables.get('currentOrderId'));
      });
    language: text/javascript
order: 16000
