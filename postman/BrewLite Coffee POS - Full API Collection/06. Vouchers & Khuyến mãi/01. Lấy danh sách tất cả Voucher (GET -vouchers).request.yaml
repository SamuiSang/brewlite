$kind: http-request
url: "{{baseUrl}}/vouchers"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      const res = pm.response.json();
      pm.test('Returns seeded vouchers array', function () {
        pm.expect(res).to.be.an('array').that.is.not.empty;
      });
    language: text/javascript
order: 1000
