$kind: http-request
url: "{{baseUrl}}/vouchers/GIAM20K"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      const res = pm.response.json();
      pm.test('Returns GIAM20K voucher details', function () {
        pm.expect(res.code).to.eql('GIAM20K');
      });
    language: text/javascript
order: 2000
