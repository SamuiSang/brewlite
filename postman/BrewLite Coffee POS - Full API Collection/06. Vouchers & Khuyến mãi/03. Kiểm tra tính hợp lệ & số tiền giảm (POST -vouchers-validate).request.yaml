$kind: http-request
url: "{{baseUrl}}/vouchers/validate"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "code": "GIAM20K",
      "subtotal": 80000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 201', function () { pm.response.to.have.status(201); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      const res = pm.response.json();
      pm.test('Voucher validation returns discountAmount 20000', function () {
        pm.expect(res.discountAmount).to.eql(20000);
      });
    language: text/javascript
order: 3000
