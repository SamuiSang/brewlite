$kind: http-request
url: "{{baseUrl}}/vouchers/{{testVoucherCode}}"
method: PATCH
headers:
  Authorization: "Bearer {{tokenAdmin}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "discountValue": 35000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      const res = pm.response.json();
      pm.test('Voucher discountValue patched to 35000', function () {
        pm.expect(res.voucher.discountValue).to.eql(35000);
      });
    language: text/javascript
order: 5000
