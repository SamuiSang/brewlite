$kind: http-request
url: "{{baseUrl}}/promotions?isActive=true"
method: GET
queryParams:
  isActive: "true"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      const res = pm.response.json();
      pm.test('Alias /promotions returns active vouchers', function () {
        pm.expect(res).to.be.an('array').that.is.not.empty;
        res.forEach(v => pm.expect(v.isActive).to.eql(true));
      });
    language: text/javascript
order: 8000
