$kind: http-request
url: "{{baseUrl}}/orders"
method: POST
headers:
  Authorization: "Bearer {{tokenCustomer}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "customerName": "Nguyễn Văn A",
      "phone": "0903334444",
      "items": [
        {
          "productId": "p1111111-1111-1111-1111-222222222222",
          "size": "M",
          "qty": 1
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 201', function () { pm.response.to.have.status(201); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      const res = pm.response.json();
      pm.collectionVariables.set('paymentOrderId', res.id);
      pm.environment.set('paymentOrderId', res.id);
    language: text/javascript
order: 2000
