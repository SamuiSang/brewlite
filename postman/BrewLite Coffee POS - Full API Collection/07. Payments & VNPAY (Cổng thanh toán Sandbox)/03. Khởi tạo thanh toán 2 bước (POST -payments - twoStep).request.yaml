$kind: http-request
url: "{{baseUrl}}/payments"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{lastIdempotencyKey}}"
body:
  type: text
  content: |-
    {
      "orderId": "{{paymentOrderId}}",
      "method": "BANK_TRANSFER",
      "twoStep": true
    }
scripts:
  - type: beforeRequest
    code: |-
      const key = `pay_${Date.now()}_${Math.floor(Math.random()*10000)}`;
      pm.environment.set('lastIdempotencyKey', key);
      pm.collectionVariables.set('lastIdempotencyKey', key);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      const res = pm.response.json();
      pm.test('2-step payment created in PENDING with QR payloads', function () {
        pm.expect(res.twoStep).to.eql(true);
        pm.expect(res.isIdempotent).to.eql(false);
        pm.expect(res.paymentId).to.be.a('string');
        pm.expect(res.vietQrUrl).to.be.a('string');
      });
      pm.collectionVariables.set('currentPaymentId', res.paymentId);
      pm.environment.set('currentPaymentId', res.paymentId);
    language: text/javascript
order: 3000
