$kind: http-request
url: "{{baseUrl}}/payments"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{lastIdempotencyKey}}"
body:
  type: text
  content: |-
    {
      "orderId": "{{paymentOrderId}}",
      "method": "BANK_TRANSFER",
      "twoStep": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      const res = pm.response.json();
      pm.test('Returns cached idempotent response with same paymentId', function () {
        pm.expect(res.isIdempotent).to.eql(true);
        pm.expect(res.paymentId).to.eql(pm.environment.get('currentPaymentId') || pm.collectionVariables.get('currentPaymentId'));
      });
    language: text/javascript
order: 4000
