$kind: http-request
url: "{{baseUrl}}/payments/{{currentPaymentId}}/qr"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
      const res = pm.response.json();
      pm.test('QR response contains qrDataUrl and vietQrUrl', function () {
        pm.expect(res.paymentId).to.eql(pm.environment.get('currentPaymentId') || pm.collectionVariables.get('currentPaymentId'));
        pm.expect(res.qrDataUrl).to.be.a('string');
      });
    language: text/javascript
order: 5000
