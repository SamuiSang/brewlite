$kind: http-request
url: "{{baseUrl}}/cart/items"
method: POST
headers:
  Authorization: "Bearer {{tokenCustomer}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "productId": "product-khong-ton-tai",
      "size": "M",
      "quantity": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 404', function () { pm.response.to.have.status(404); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
    language: text/javascript
order: 5000
