$kind: http-request
url: "{{baseUrl}}/cart/items/nonexistent-cart-item-id"
method: DELETE
headers:
  Authorization: "Bearer {{tokenCustomer}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 404', function () { pm.response.to.have.status(404); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
    language: text/javascript
order: 6000
