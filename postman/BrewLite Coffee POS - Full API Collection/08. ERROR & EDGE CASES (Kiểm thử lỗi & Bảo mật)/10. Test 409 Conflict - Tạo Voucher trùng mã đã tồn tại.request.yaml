$kind: http-request
url: "{{baseUrl}}/vouchers"
method: POST
headers:
  Authorization: "Bearer {{tokenAdmin}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "code": "WELCOME10",
      "discountType": "PERCENTAGE",
      "discountValue": 10
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 409', function () { pm.response.to.have.status(409); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
    language: text/javascript
order: 10000
