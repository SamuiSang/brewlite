$kind: http-request
url: "{{baseUrl}}/vouchers"
method: POST
headers:
  Authorization: "Bearer {{tokenAdmin}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "code": "SUPER150",
      "discountType": "PERCENTAGE",
      "discountValue": 150
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 400', function () { pm.response.to.have.status(400); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
    language: text/javascript
order: 11000
