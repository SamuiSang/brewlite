$kind: http-request
url: "{{baseUrl}}/orders/{{errorPendingOrderId}}/status"
method: PATCH
headers:
  Authorization: "Bearer {{tokenBarista}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "status": "COMPLETED",
      "reason": "Cố tình nhảy cóc trạng thái"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 400', function () { pm.response.to.have.status(400); });
      pm.test('Response time is under 3000ms', function () { pm.expect(pm.response.responseTime).to.be.below(3000); });
    language: text/javascript
order: 13000
