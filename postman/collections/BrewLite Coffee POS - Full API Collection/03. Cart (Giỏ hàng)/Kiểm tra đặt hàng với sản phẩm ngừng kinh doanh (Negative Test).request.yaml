$kind: http-request
url: "{{baseUrl}}/orders"
method: POST
headers:
  Authorization: Bearer {{tokenCustomer}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "customerName": "Nguyễn Văn A",
      "phone": "0903334444",
      "items": [
        {
          "productId": "p0000000-0000-0000-0000-000000000000",
          "size": "M",
          "qty": 1
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400 or 404", function () {
          pm.expect(pm.response.code).to.be.oneOf([400, 404]);
      });
      pm.test("Rejects order containing discontinued product", function () {
          const res = pm.response.json();
          pm.expect(JSON.stringify(res.message)).to.match(/ngừng kinh doanh|ngừng bán|không tồn tại/i);
      });
    language: text/javascript
order: 15000
