$kind: http-request
url: "{{baseUrl}}/cart"
method: PUT
headers:
  Authorization: Bearer {{tokenCustomer}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "items": [
        {
          "productId": "p1111111-1111-1111-1111-222222222222",
          "size": "XL",
          "quantity": 1
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Size validation rejected", function () {
          const res = pm.response.json();
          pm.expect(JSON.stringify(res.message)).to.include("size must be one of the following values: S, M, L");
      });
    language: text/javascript
order: 12000
