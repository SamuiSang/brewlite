$kind: http-request
url: "{{baseUrl}}/cart"
method: PUT
headers:
  Authorization: Bearer {{tokenCustomer}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "items": [
        {
          "productId": "p1111111-1111-1111-1111-222222222222",
          "size": "M",
          "quantity": -5
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Validation error specifies minimum quantity is 1", function () {
          const res = pm.response.json();
          pm.expect(JSON.stringify(res.message)).to.include("Số lượng tối thiểu là 1");
      });
    language: text/javascript
order: 11000
