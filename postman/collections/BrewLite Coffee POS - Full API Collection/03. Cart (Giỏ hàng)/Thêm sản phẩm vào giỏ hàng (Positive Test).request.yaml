$kind: http-request
url: "{{baseUrl}}/cart"
method: PUT
headers:
  Authorization: Bearer {{tokenCustomer}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "items": [
        {
          "productId": "p1111111-1111-1111-1111-222222222222",
          "size": "M",
          "quantity": 1,
          "toppings": [
            "t1111111-1111-1111-1111-111111111111"
          ],
          "note": "Ít ngọt 70%"
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response contains cart id, userId and items array", function () {
          const res = pm.response.json();
          pm.expect(res).to.have.property('id');
          pm.expect(res).to.have.property('userId');
          pm.expect(res.items).to.be.an('array');
      });
    language: text/javascript
order: 4000
