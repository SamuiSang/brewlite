$kind: http-request
url: "{{baseUrl}}/orders/validate-voucher"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "code": "BREW5",
      "subtotal": 35000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 Created", function () {
          pm.response.to.have.status(201);
      });
      pm.test("BREW5 discount applied correctly (5.000đ)", function () {
          const res = pm.response.json();
          pm.expect(res.code).to.equal("BREW5");
          pm.expect(res.discountAmount).to.equal(5000);
          pm.expect(res.finalAmount).to.equal(30000);
      });
    language: text/javascript
order: 3000
