$kind: http-request
url: "{{baseUrl}}/orders/validate-voucher"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "code": "BREWLITE",
      "subtotal": 120000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 Created", function () {
          pm.response.to.have.status(201);
      });
      pm.test("BREWLITE 15% discount applied correctly", function () {
          const res = pm.response.json();
          pm.expect(res.code).to.equal("BREWLITE");
          pm.expect(res.discountType).to.equal("PERCENTAGE");
          pm.expect(res.discountValue).to.equal(15);
          pm.expect(res.discountAmount).to.equal(18000); // 15% của 120.000đ
          pm.expect(res.finalAmount).to.equal(102000);
      });
    language: text/javascript
order: 2000
