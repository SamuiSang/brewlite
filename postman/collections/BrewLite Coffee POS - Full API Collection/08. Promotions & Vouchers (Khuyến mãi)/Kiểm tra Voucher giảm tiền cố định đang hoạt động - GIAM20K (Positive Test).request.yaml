$kind: http-request
url: "{{baseUrl}}/orders/validate-voucher"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "code": "GIAM20K",
      "subtotal": 70000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 Created", function () {
          pm.response.to.have.status(201);
      });
      pm.test("GIAM20K discount applied correctly (20.000đ)", function () {
          const res = pm.response.json();
          pm.expect(res.code).to.equal("GIAM20K");
          pm.expect(res.discountType).to.equal("FIXED_AMOUNT");
          pm.expect(res.discountAmount).to.equal(20000);
          pm.expect(res.subtotal).to.equal(70000);
          pm.expect(res.finalAmount).to.equal(50000);
          pm.expect(res.finalAmount).to.equal(res.subtotal - res.discountAmount);
      });
    language: text/javascript
order: 1000
