$kind: http-request
url: "{{baseUrl}}/orders/validate-voucher"
method: POST
headers:
  Authorization: Bearer {{tokenCustomer}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "code": "GIAM20K",
      "subtotal": 70000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Error message indicates voucher has already been used by this account", function () {
          const res = pm.response.json();
          pm.expect(res.message).to.include("đã sử dụng mã khuyến mãi");
      });
    language: text/javascript
order: 13000
