$kind: http-request
url: "{{baseUrl}}/orders/validate-voucher"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "code": "INVALID_CODE_999",
      "subtotal": 100000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 404 Not Found", function () {
          pm.response.to.have.status(404);
      });
      pm.test("Error indicates voucher does not exist", function () {
          const res = pm.response.json();
          pm.expect(res.message).to.include("không tồn tại");
      });
    language: text/javascript
order: 10000
