$kind: http-request
url: "{{baseUrl}}/orders"
method: POST
headers:
  Authorization: Bearer {{tokenCustomer}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "customerName": "Nguyễn Văn A",
      "phone": "0903334444",
      "items": [
        {
          "productId": "p1111111-1111-1111-1111-111111111111",
          "size": "M",
          "qty": 2
        },
        {
          "productId": "p1111111-1111-1111-1111-222222222222",
          "size": "M",
          "qty": 1
        }
      ],
      "promotionCode": "GIAM20K"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 Created or 400 if voucher was already used", function () {
          pm.expect(pm.response.code).to.be.oneOf([201, 400]);
      });
      pm.test("Promotion applied on first use or rejected if already used", function () {
          const res = pm.response.json();
          if (pm.response.code === 201) {
              pm.expect(res.promotionCode).to.equal("GIAM20K");
              pm.expect(Number(res.discountAmount)).to.equal(20000);
              pm.expect(Number(res.totalAmount)).to.equal(Number(res.subtotal) - Number(res.discountAmount));
          } else {
              pm.expect(res.message).to.include("đã sử dụng mã khuyến mãi");
          }
      });
    language: text/javascript
order: 12000
