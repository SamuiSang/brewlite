$kind: http-request
url: "{{baseUrl}}/orders"
method: POST
headers:
  Authorization: Bearer {{tokenCustomer}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "customerName": "Nguyễn Văn A",
      "phone": "0903334444",
      "items": [
        {
          "productId": "p1111111-1111-1111-1111-111111111111",
          "size": "S",
          "qty": 1
        }
      ],
      "promotionCode": null
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 Created", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Order created without discount", function () {
          const res = pm.response.json();
          pm.expect(Number(res.discountAmount)).to.equal(0);
          pm.expect(Number(res.totalAmount)).to.equal(Number(res.subtotal));
      });
    language: text/javascript
order: 14000
